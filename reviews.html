<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reviews | JR Garden Help</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo" id="site-logo">JR Garden Help</div>
    <nav>
      <a href="index.html" id="nav-home">Home</a>
      <a href="index.html#services" id="nav-services">Services</a>
      <a href="index.html#about" id="nav-about">About</a>
      <a href="index.html#contact" id="nav-contact">Contact</a>
      <button id="lang-toggle">Gàidhlig (Scottish Gaelic)</button>
    </nav>
  </header>

  <main>
    <section id="reviews-hero">
      <h1 id="rev-h1">Reviews</h1>
      <p id="rev-p">Read what my customers say about my gardening services in Dumbarton, West Dunbartonshire and beyond.</p>
    </section>

    <section class="review-submit">
      <h2 id="rev-form-title">Submit Your Review</h2>
      <form action="https://formspree.io/f/mojjqlwk" method="POST">
        <input type="hidden" name="_next" id="redirect-url" value="https://jrgardenhelp.github.io/jr-garden-help/success.html?lang=en">
        <input type="text" id="review-name-input" name="name" placeholder="Your Name" required />
        <div class="rating-group">
          <label id="rating-label">Rating:</label>
          <select name="rating" required id="rating-dropdown">
            <option value="" id="opt-select">— Select —</option>
            <option value="5" id="opt-5">⭐⭐⭐⭐⭐ (Excellent)</option>
            <option value="4" id="opt-4">⭐⭐⭐⭐ (Very Good)</option>
            <option value="3" id="opt-3">⭐⭐⭐ (Good)</option>
            <option value="2" id="opt-2">⭐⭐ (Fair)</option>
            <option value="1" id="opt-1">⭐ (Poor)</option>
          </select>
        </div>
        <textarea id="review-text-input" name="review" placeholder="Your Review / Feedback" rows="6" required></textarea>
        <input type="email" id="review-email-input" name="_replyto" placeholder="Your Email (optional)" />
        <button type="submit" id="review-submit-btn">Submit Review</button>
      </form>
    </section>
  </main>

  <footer>
    <p id="footer-text">© 2025 JR Garden Help – All rights reserved.</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
